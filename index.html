<style>
:root{
  --bg1:#2a1530; --bg2:#5b2448; --bg3:#c25b7a;
  --card:rgba(255,255,255,.96); --ink:#2a1530; --muted:#7a6680;
  --accent:#c2457a; --accent2:#e9a23b; --line:#eadfe8; --chip:#fbf4f8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"DM Sans",system-ui,-apple-system,sans-serif;color:var(--ink);
  background:var(--bg1);min-height:100dvh;overflow-x:hidden;
}
/* Foto di sfondo: a pieno schermo, velo scuro per leggere bene.
   Sull'intro la foto si vede di più, durante le domande il velo è più scuro. */
.bg{position:fixed;inset:0;z-index:0;background:url("sfondo.jpg") center 40%/cover no-repeat;transition:filter .6s ease,transform .8s ease}
.veil{position:fixed;inset:0;z-index:0;transition:opacity .6s ease;
  background:linear-gradient(180deg,rgba(42,21,48,0) 0%,rgba(42,21,48,.1) 55%,rgba(42,21,48,.85) 80%,rgba(42,21,48,.96) 100%)}
.veil2{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity .6s ease;
  background:linear-gradient(180deg,rgba(42,21,48,.55),rgba(91,36,72,.72))}
body.quiz .bg{filter:blur(3px) saturate(1.05);transform:scale(1.04)}
body.quiz .veil2{opacity:1}
.screen.is-intro{justify-content:flex-end;padding-bottom:8px}
.sparkles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sparkles i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.0;animation:tw 4s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.75;transform:scale(1.2)}}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;height:40px;margin-bottom:12px;visibility:hidden}
.top.on{visibility:visible}
.back{border:0;background:rgba(255,255,255,.14);color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.back:disabled{opacity:.3}
.bar{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),#fff);border-radius:6px;transition:width .35s ease}
.count{color:rgba(255,255,255,.8);font-size:13px;font-weight:500;min-width:34px;text-align:right}
.screen{flex:1;display:flex;flex-direction:column;justify-content:center;will-change:transform,opacity}
.screen.in-up{animation:inUp .42s cubic-bezier(.2,.8,.2,1) both}
.screen.in-down{animation:inDown .42s cubic-bezier(.2,.8,.2,1) both}
.screen.out-up{animation:outUp .22s ease-in both}
.screen.out-down{animation:outDown .22s ease-in both}
@keyframes inUp{from{opacity:0;transform:translateY(45vh)}to{opacity:1;transform:none}}
@keyframes inDown{from{opacity:0;transform:translateY(-45vh)}to{opacity:1;transform:none}}
@keyframes outUp{to{opacity:0;transform:translateY(-35vh)}}
@keyframes outDown{to{opacity:0;transform:translateY(35vh)}}
.swipe-hint{text-align:center;color:rgba(255,255,255,.7);font-size:13px;margin-top:14px;min-height:18px}
.card{background:var(--card);border-radius:24px;padding:26px 20px;box-shadow:0 20px 50px rgba(20,5,25,.35)}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em}
.intro{text-align:center;color:#fff}
.intro .emoji{font-size:56px;margin-bottom:14px}
.intro h1{font-size:32px;line-height:1.1;margin-bottom:10px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.intro p{color:rgba(255,255,255,.9);font-size:16px;line-height:1.45;margin-bottom:20px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:17px 18px;font:700 17px "DM Sans",sans-serif;cursor:pointer;transition:transform .12s ease,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:#fff;color:var(--ink)}
.btn.accent{background:linear-gradient(135deg,#25d366,#128c7e);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500;font-size:15px;padding:12px}
.btn.soft{background:var(--chip);color:var(--ink);border:1.5px solid var(--line)}
.q-kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.q-title{font-size:25px;line-height:1.2;margin-bottom:20px}
.hint{color:var(--muted);font-size:14px;margin:-12px 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px 14px;font:500 16px/1.3 "DM Sans",sans-serif;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .12s}
.opt:active{transform:scale(.985)}
.opt .e{font-size:26px;width:36px;text-align:center;flex:none}
.opt small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:3px}
.opt.sel{border-color:var(--accent);background:#fdf0f6}
.opt .rank{margin-left:auto;font-weight:700;font-size:14px;color:var(--accent);min-width:24px;text-align:right}
.stars{display:flex;justify-content:center;gap:8px;margin:8px 0 10px}
.star{border:0;background:none;font-size:44px;line-height:1;cursor:pointer;color:#e6dbe4;transition:transform .12s,color .15s}
.star.on{color:var(--accent2)}
.star:active{transform:scale(.9)}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:0 6px}
.other-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:2px}
.other-row input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:16px "DM Sans",sans-serif;color:var(--ink);outline:none;background:#fff}
.other-row input:focus{border-color:var(--accent)}
.other-row .btn{width:auto;padding:12px 16px;font-size:15px}
textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:16px;padding:14px;font:16px/1.4 "DM Sans",sans-serif;color:var(--ink);resize:vertical;outline:none;background:#fff}
textarea:focus{border-color:var(--accent)}
.row{display:grid;gap:8px;margin-top:16px}
.result{text-align:center}
.result .badge{font-size:54px;margin-bottom:6px}
.result .pre{color:var(--muted);font-size:14px;font-weight:500}
.result h2{font-size:32px;line-height:1.1;margin:6px 0 14px;background:linear-gradient(135deg,var(--accent),#7b2d6b);-webkit-background-clip:text;background-clip:text;color:transparent}
.result .kind{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:22px;color:var(--ink);margin:-6px 0 12px}
.result p.desc{font-size:16px;line-height:1.55;color:#4a3a50;margin-bottom:18px}
.traits{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}
.trait{background:var(--chip);border-radius:14px;padding:12px 10px}
.trait b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.trait span{font-size:15px;font-weight:500}
/* Gratta e scopri */
.reveal{position:relative;border-radius:18px;padding:12px 0 4px;margin:6px 0 4px}
canvas.scratch{position:absolute;inset:0;width:100%;height:100%;border-radius:18px;touch-action:none;cursor:pointer;transition:opacity .5s ease}
.reveal-alt{background:none;border:0;color:var(--muted);font:13px "DM Sans",sans-serif;text-decoration:underline;margin:2px 0 6px;cursor:pointer}
.after{display:none}
.after.show{display:block;animation:afterIn .55s ease both}
@keyframes afterIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* Mix in percentuali */
.bars{display:grid;gap:9px;margin:2px 0 18px;text-align:left}
.barrow{display:grid;grid-template-columns:118px 1fr 40px;align-items:center;gap:8px;font-size:14px;font-weight:500}
.track{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.barrow .pct{text-align:right;color:var(--accent);font-weight:700}
/* Reazione al tocco */
.opt.sel .e{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(1)}}
/* Indizi a metà strada */
.teaser{color:#fff;text-align:center;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:28px;line-height:1.25;padding:0 12px;text-shadow:0 2px 18px rgba(0,0,0,.3)}
.sent{color:var(--muted);font-size:14px;margin-top:10px;min-height:20px}
.copybox{display:none;margin-top:12px;text-align:left;white-space:pre-wrap;font-size:13px;background:var(--chip);border-radius:12px;padding:12px;color:#4a3a50;max-height:180px;overflow:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>
<div class="veil2" aria-hidden="true"></div>
<div class="sparkles" id="sparkles" aria-hidden="true"></div>
<main class="wrap">
  <div class="top" id="top">
    <button class="back" id="back" aria-label="Indietro">˄</button>
    <div class="bar"><span id="barfill"></span></div>
    <div class="count" id="count"></div>
  </div>
  <div id="stage" class="screen"></div>
</main>

<script>
(function(){
  "use strict";

  // Domande. "c" = tratto del profilo (glam, cozy, zen, explorer, dreamer).
  // "show" = domanda che compare solo con certe risposte (A = risposte date finora).
  function has(A,id,i){ var v = A[id]; return Array.isArray(v) ? v.indexOf(i) >= 0 : v === i; }
  function first(A,id,i){ var v = A[id]; return Array.isArray(v) ? v[0] === i : v === i; }
  var Q = [
    {id:12, kind:"choice", kicker:"Per scaldarci", title:"Il tuo superpotere da make-up artist?", label:"Superpotere",
     opts:[
      {e:"✍️", t:"Eyeliner perfetto al primo colpo", c:""},
      {e:"✨", t:"Una base che sembra pelle vera", c:""},
      {e:"💋", t:"Labbra da copertina", c:""},
      {e:"🪄", t:"Sopracciglia scolpite", c:""}]},
    {id:1, kind:"choice", kicker:"Come stai", title:"In questo periodo ti senti più…", label:"Mi sento",
     opts:[
      {e:"😮‍💨", t:"Stanca, con voglia di staccare", c:"zen"},
      {e:"⚡", t:"Carica, con voglia di novità", c:"explorer"},
      {e:"💼", t:"Con la testa sul lavoro", c:"glam"},
      {e:"🫶", t:"Con voglia di coccole", c:"cozy"}]},
    {id:2, kind:"choice", kicker:"La tua settimana", title:"Il tuo momento preferito della settimana?", label:"Momento preferito",
     opts:[
      {e:"🎬", t:"Un film al cinema", c:"dreamer"},
      {e:"🛁", t:"Il tempo solo per me", c:"cozy"},
      {e:"🚆", t:"Andare a scoprire qualcosa di nuovo", c:"explorer"},
      {e:"💄", t:"Creare un look", c:"glam"}]},
    {id:3, kind:"choice", kicker:"Confessa", title:"Cosa non fai da troppo tempo?", label:"Da troppo non faccio",
     opts:[
      {e:"🧖‍♀️", t:"Una giornata di relax totale", c:"zen"},
      {e:"🚆", t:"Una gita fuori città", c:"explorer"},
      {e:"🍿", t:"Una serata al cinema", c:"dreamer"},
      {e:"🕯️", t:"Una serata di coccole tutta per me", c:"cozy"}]},
    {id:4, kind:"two", kicker:"Giornata libera", title:"Una giornata libera tutta per te. La passi…", label:"Giornata libera",
     hint:"Tocca la prima scelta, poi la seconda",
     opts:[
      {e:"♨️", t:"Tra sauna e piscine calde", c:"zen"},
      {e:"🏙️", t:"In una città mai vista", c:"explorer"},
      {e:"💄", t:"A provare trucchi nuovi", c:"glam"},
      {e:"🍿", t:"Al cinema", c:"dreamer"},
      {e:"⛷️", t:"Sulla neve, tra piste e baita", c:"explorer"}]},
    {id:5, kind:"choice", kicker:"Sii sincera", title:"Il tuo sfizio che rimandi sempre?", label:"Sfizio rimandato",
     opts:[
      {e:"💅", t:"Un trattamento tutto per me", s:"viso, mani, capelli…", c:"zen"},
      {e:"👜", t:"Un accessorio bello che non mi compro mai", c:"glam"},
      {e:"✈️", t:"Un'esperienza da \"un giorno lo farò\"", c:"explorer"},
      {e:"💄", t:"Un prodotto top che mi sembra esagerato", c:"glam"},
      {e:"✍️", t:"Altro", other:true, ph:"Scrivilo qui…", c:""}]},
    {id:51, kind:"choice", kicker:"Dimmi di più", title:"Il trattamento dei sogni?", label:"Trattamento dei sogni",
     show:function(A){ return A[5] === 0; },
     opts:[
      {e:"🧖‍♀️", t:"Un trattamento viso da vera diva", c:"zen"},
      {e:"💅", t:"Mani e piedi perfetti", c:"glam"},
      {e:"💇‍♀️", t:"Una giornata dal parrucchiere top", c:"glam"},
      {e:"💆‍♀️", t:"Un massaggio solo per me", c:"zen"}]},
    {id:52, kind:"choice", kicker:"Dimmi di più", title:"L'accessorio che ti fa battere il cuore?", label:"Accessorio del cuore",
     show:function(A){ return A[5] === 1; },
     opts:[
      {e:"👜", t:"Una borsa", c:"glam"},
      {e:"🧣", t:"Una sciarpa o un foulard", c:"cozy"},
      {e:"🕶️", t:"Occhiali da sole", c:"explorer"},
      {e:"🧢", t:"Un cappello o un berretto", c:"cozy"},
      {e:"✍️", t:"Altro", other:true, ph:"Scrivilo qui…", c:""}]},
    {id:6, kind:"choice", kicker:"La tua nota", title:"Che profumo ti somiglia di più?", label:"Profumo",
     opts:[
      {e:"🌸", t:"Fiori delicati", c:""},
      {e:"🍊", t:"Agrumi solari", c:""},
      {e:"🪵", t:"Legni caldi e spezie", c:""},
      {e:"🌊", t:"Fresco e pulito", c:""}]},
    {id:7, kind:"choice", kicker:"Piccoli drammi", title:"La piccola cosa che ti fa impazzire ogni giorno?", label:"Fastidio quotidiano",
     opts:[
      {e:"🖌️", t:"I pennelli che si rovinano", c:"glam"},
      {e:"👛", t:"Nella borsa non trovo mai niente", c:""},
      {e:"🥶", t:"Il freddo a mani e piedi", c:"cozy"},
      {e:"🔋", t:"Il telefono che si scarica", c:""},
      {e:"✍️", t:"Altro", other:true, ph:"Scrivilo qui…", c:""}]},
    {id:71, kind:"choice", kicker:"Tra noi MUA", title:"I pennelli che ti finiscono prima?", label:"Pennelli più usati",
     show:function(A){ return A[7] === 0; },
     opts:[
      {e:"🫧", t:"Fondotinta e correttore", c:"glam"},
      {e:"👁️", t:"Occhi e sfumature", c:"glam"},
      {e:"🌸", t:"Cipria, blush e bronzer", c:"glam"},
      {e:"💋", t:"Labbra e dettagli", c:"glam"}]},
    {id:8, kind:"choice", kicker:"Il tuo inverno", title:"Domenica di gennaio, fuori fa freddo. Il piano perfetto?", label:"Domenica di gennaio",
     opts:[
      {e:"♨️", t:"Al caldo tra vapore e piscine", c:"zen"},
      {e:"⛷️", t:"Sulle piste, tra neve e sole", c:"explorer"},
      {e:"🚆", t:"In treno verso una città nuova", c:"explorer"},
      {e:"🍿", t:"Al buio in sala, con i popcorn", c:"dreamer"},
      {e:"🕯️", t:"A casa tra candele, bagno caldo e creme", c:"cozy"}]},
    {id:81, kind:"choice", kicker:"Dimmi di più", title:"Sulla neve tu sei più…", label:"Sulla neve",
     show:function(A){ return has(A,4,4) || A[8] === 1; },
     opts:[
      {e:"🎿", t:"Sci ai piedi", c:"explorer"},
      {e:"🏂", t:"Snowboard", c:"explorer"},
      {e:"❄️", t:"Ciaspole e passeggiate", c:"explorer"},
      {e:"☕", t:"Baita, sole e cioccolata calda", c:"cozy"}]},
    {id:82, kind:"choice", kicker:"Dimmi di più", title:"Il tuo relax perfetto?", label:"Relax perfetto",
     show:function(A){ return A[3] === 0 || first(A,4,0) || A[8] === 0; },
     opts:[
      {e:"🌊", t:"Piscine calde all'aperto, anche col freddo", c:"zen"},
      {e:"🔥", t:"Sauna e bagno turco", c:"zen"},
      {e:"🏔️", t:"Con vista sulle montagne", c:"explorer"},
      {e:"🌃", t:"Di sera, con le luci della città", c:"dreamer"}]},
    {id:9, kind:"choice", kicker:"Nuovo capitolo", title:"Il trasloco a Milano, in una parola?", label:"Trasloco a Milano",
     opts:[
      {e:"🎉", t:"Non vedo l'ora: vita nuova!", c:"explorer"},
      {e:"😅", t:"Un po' d'ansia, tante cose da sistemare", c:"zen"},
      {e:"🥲", t:"Un po' di nostalgia", c:"dreamer"},
      {e:"🙈", t:"Ci penso più avanti", c:"cozy"}]},
    {id:91, kind:"choice", kicker:"Dimmi di più", title:"La prima cosa che vuoi fare a Milano?", label:"Prima cosa a Milano",
     show:function(A){ return A[9] === 0; },
     opts:[
      {e:"🍝", t:"Scoprire locali e ristoranti", c:"explorer"},
      {e:"🏡", t:"Rendere bella la casa nuova", c:"cozy"},
      {e:"🖼️", t:"Mostre e musei", c:"dreamer"},
      {e:"🛍️", t:"Mercatini e negozietti", c:"glam"}]},
    {id:10, kind:"text", kicker:"Ultima!", title:"Il prodotto o i prodotti beauty di cui non potresti mai fare a meno?", label:"Must-have beauty",
     ph:"es. il tuo mascara del cuore, una crema, un pennello…"}
  ];

  // Le domande visibili adesso, in base alle risposte date.
  function V(){ return Q.filter(function(q){ return !q.show || q.show(answers); }); }

  var PROFILES = {
    glam:{n:"Glam", e:"💄", d:"Esci in dieci minuti, ma con l'eyeliner perfetto. Il trucco per te non è una maschera: è il tuo modo di dire le cose."},
    cozy:{n:"Cozy", e:"🧸", d:"Coperta, serie e snack a portata di mano: il tuo habitat naturale. Nessuno si gode le cose semplici come te."},
    zen:{n:"Zen", e:"♨️", d:"Dai il cento per cento a tutti, poi ti serve il tuo momento di pace. E guai a chi te lo tocca."},
    explorer:{n:"Esploratrice", e:"🗺️", d:"Valigia mentale sempre pronta. Un posto mai visto, una prima volta: è lì che ti accendi."},
    dreamer:{n:"Sognatrice", e:"🎬", d:"Vivi le giornate come scene di un film, colonna sonora compresa. Le storie belle te le ricordi per anni."}
  };
  var ORDER = ["glam","cozy","zen","explorer","dreamer"];

  var answers = {};   // id -> index | stars | text
  var step = -1;      // -1 intro, 0..8 domande, 9 risultato
  var stage = document.getElementById("stage");
  var top = document.getElementById("top");
  var back = document.getElementById("back");
  var fill = document.getElementById("barfill");
  var count = document.getElementById("count");

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(text != null) n.textContent = text;
    return n;
  }

  var busy = false;
  // Indizi brevi che compaiono andando avanti, prima di alcune domande.
  var TEASE = {6:"Mmh… iniziamo a capire chi sei 👀"};
  // Cambio schermata in verticale: avanti = sale verso l'alto, indietro = scende.
  function go(newStep, dir){
    if(busy) return;
    busy = true;
    stage.className = "screen out-" + dir;
    setTimeout(function(){
      var nq = V()[newStep];
      if(dir === "up" && nq && TEASE[nq.id]){
        stage.textContent = "";
        stage.appendChild(el("div","teaser",TEASE[nq.id]));
        stage.className = "screen in-up";
        setTimeout(function(){
          stage.className = "screen out-up";
          setTimeout(function(){ show(newStep, dir); }, 220);
        }, 1150);
      } else show(newStep, dir);
    }, 220);
  }
  function show(newStep, dir){
    step = newStep;
    render();
    stage.className = "screen in-" + dir + (step < 0 ? " is-intro" : "");
    setTimeout(function(){ busy = false; }, 420);
  }
  function buzz(){ try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){} }

  function answered(){
    if(step < 0) return true;
    var L = V();
    if(step >= L.length) return false;
    var q = L[step];
    if(q.kind === "two") return Array.isArray(answers[q.id]) && answers[q.id].length === 2;
    return q.kind === "text" || answers[q.id] != null;
  }

  // Swipe verticale: su = avanti (se ha risposto), giù = indietro.
  var y0 = null;
  document.addEventListener("touchstart", function(e){
    var tg = e.target.tagName;
    y0 = (tg === "TEXTAREA" || tg === "CANVAS" || tg === "INPUT") ? null : e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener("touchend", function(e){
    if(y0 == null) return;
    var dy = e.changedTouches[0].clientY - y0; y0 = null;
    var L = V();
    if(dy < -60 && answered() && step < L.length){
      var oi = stage.querySelector(".other-row input");
      if(oi && step >= 0) answers[L[step].id + "_t"] = oi.value.trim();
      if(step >= 0 && L[step].kind === "text"){
        answers[L[step].id] = (stage.querySelector("textarea") || {value:""}).value.trim();
      }
      go(step + 1, "up");
    } else if(dy > 60 && step >= 0){
      go(step - 1, "down");
    }
  }, {passive:true});

  function render(){
    stage.textContent = "";
    document.body.classList.toggle("quiz", step >= 0);
    if(step < 0) return renderIntro();
    var L = V();
    if(step >= L.length) return renderResult();
    top.classList.add("on");
    back.disabled = false;
    fill.style.width = (step / L.length * 100) + "%";
    count.textContent = "";
    var q = L[step];
    var card = el("section","card");
    card.appendChild(el("div","q-kicker",q.kicker));
    card.appendChild(el("h2","q-title",q.title));
    if(q.hint) card.appendChild(el("p","hint",q.hint));
    if(q.kind === "choice") renderChoice(card,q);
    else if(q.kind === "two") renderTwo(card,q);
    else if(q.kind === "stars") renderStars(card,q);
    else renderText(card,q);
    stage.appendChild(card);
    stage.appendChild(el("div","swipe-hint", step === 0 ? "Tocca una risposta · scorri in giù per tornare indietro" : ""));
    window.scrollTo(0,0);
  }

  function renderIntro(){
    top.classList.remove("on");
    var d = el("section","intro");
    d.appendChild(el("h1",null,"Che tipo di Nicole sei? ✨"));
    d.appendChild(el("p",null,"Una decina di domande, 3 minuti. Rispondi d'istinto, senza pensarci troppo: alla fine scopri il tuo profilo."));
    var b = el("button","btn primary","Iniziamo 💫");
    b.onclick = function(){ go(0, "up"); };
    d.appendChild(b);
    stage.appendChild(d);
  }

  function renderChoice(card,q){
    var box = el("div","opts");
    var otherRow = null;
    q.opts.forEach(function(o,i){
      var b = el("button","opt" + (answers[q.id] === i ? " sel" : ""));
      b.type = "button";
      b.appendChild(el("span","e",o.e));
      var t = el("span",null,o.t);
      if(o.s) t.appendChild(el("small",null,o.s));
      b.appendChild(t);
      b.onclick = function(){
        answers[q.id] = i;
        buzz();
        Array.prototype.forEach.call(box.querySelectorAll(".opt"),function(c){c.classList.remove("sel")});
        b.classList.add("sel");
        if(o.other){ otherRow.style.display = "grid"; otherRow.querySelector("input").focus(); return; }
        if(otherRow) otherRow.style.display = "none";
        setTimeout(next, 260);
      };
      box.appendChild(b);
      if(o.other){
        otherRow = el("div","other-row");
        var inp = el("input"); inp.type = "text"; inp.maxLength = 120; inp.placeholder = o.ph || "Scrivilo qui…";
        inp.value = answers[q.id + "_t"] || "";
        var ok = el("button","btn primary","Avanti");
        ok.style.background = "linear-gradient(135deg,var(--accent),#7b2d6b)"; ok.style.color = "#fff";
        ok.onclick = function(){ answers[q.id + "_t"] = inp.value.trim(); next(); };
        inp.addEventListener("keydown", function(e){ if(e.key === "Enter") ok.onclick(); });
        otherRow.appendChild(inp); otherRow.appendChild(ok);
        otherRow.style.display = answers[q.id] === i ? "grid" : "none";
        box.appendChild(otherRow);
      }
    });
    card.appendChild(box);
  }

  // Due scelte in ordine: il primo tocco è la prima scelta, il secondo la seconda.
  function renderTwo(card,q){
    var box = el("div","opts");
    var picks = Array.isArray(answers[q.id]) ? answers[q.id].slice() : [];
    var btns = [];
    function paint(){
      btns.forEach(function(b,i){
        var k = picks.indexOf(i);
        b.classList.toggle("sel", k >= 0);
        b.querySelector(".rank").textContent = k >= 0 ? (k === 0 ? "1ª" : "2ª") : "";
      });
    }
    q.opts.forEach(function(o,i){
      var b = el("button","opt");
      b.type = "button";
      b.appendChild(el("span","e",o.e));
      b.appendChild(el("span",null,o.t));
      b.appendChild(el("span","rank",""));
      b.onclick = function(){
        var k = picks.indexOf(i);
        if(k >= 0){ picks.splice(k,1); }
        else if(picks.length < 2){ picks.push(i); }
        answers[q.id] = picks.slice();
        buzz();
        paint();
        if(picks.length === 2) setTimeout(next, 380);
      };
      btns.push(b); box.appendChild(b);
    });
    paint();
    card.appendChild(box);
  }

  function renderStars(card,q){
    var wrap = el("div","stars");
    var cur = answers[q.id] || 0;
    var btns = [];
    for(var i=1;i<=5;i++){
      (function(v){
        var s = el("button","star" + (v <= cur ? " on" : ""),"★");
        s.type = "button";
        s.setAttribute("aria-label", v + " stelle");
        s.onclick = function(){
          answers[q.id] = v;
          btns.forEach(function(x,k){ x.classList.toggle("on", k < v); });
          setTimeout(next, 380);
        };
        btns.push(s); wrap.appendChild(s);
      })(i);
    }
    card.appendChild(wrap);
    var sc = el("div","scale");
    sc.appendChild(el("span",null,q.lo)); sc.appendChild(el("span",null,q.hi));
    card.appendChild(sc);
  }

  function renderText(card,q){
    var ta = el("textarea");
    ta.placeholder = q.ph;
    ta.maxLength = 220;
    ta.value = answers[q.id] || "";
    card.appendChild(ta);
    var row = el("div","row");
    var go = el("button","btn primary","Scopri il tuo profilo ✨");
    go.style.background = "linear-gradient(135deg,var(--accent),#7b2d6b)"; go.style.color = "#fff";
    go.onclick = function(){ answers[q.id] = ta.value.trim(); next(); };
    var skip = el("button","btn ghost","Salta");
    skip.onclick = function(){ answers[q.id] = ""; next(); };
    row.appendChild(go); row.appendChild(skip);
    card.appendChild(row);
  }

  function next(){ go(step + 1, "up"); }
  back.onclick = function(){ if(step >= 0) go(step - 1, "down"); };

  function scores(){
    var score = {glam:0,cozy:0,zen:0,explorer:0,dreamer:0};
    V().forEach(function(q){
      if(q.kind === "choice" && answers[q.id] != null){
        var c = q.opts[answers[q.id]].c;
        if(c) score[c] += 1;
      }
      if(q.kind === "two" && Array.isArray(answers[q.id])){
        answers[q.id].forEach(function(i,k){ var c2 = q.opts[i].c; if(c2) score[c2] += (k === 0 ? 1 : 0.5); });
      }
    });
    return score;
  }

  function ranked(score){
    return ORDER.slice().sort(function(a,b){ return score[b] - score[a] || ORDER.indexOf(a) - ORDER.indexOf(b); });
  }

  function profile(){
    var score = scores(), r = ranked(score);
    return score[r[1]] > 0 ? [r[0], r[1]] : [r[0]];
  }

  // Mix in percentuali (fino a 4 tratti, somma 100).
  function mix(){
    var score = scores(), r = ranked(score).filter(function(k){ return score[k] > 0; }).slice(0,4);
    var tot = r.reduce(function(t,k){ return t + score[k]; }, 0) || 1;
    var out = r.map(function(k){ return {k:k, pct: Math.round(score[k] / tot * 100)}; });
    var diff = 100 - out.reduce(function(t,o){ return t + o.pct; }, 0);
    if(out.length) out[0].pct += diff;
    return out;
  }
  function mixText(){
    return mix().map(function(o){ return PROFILES[o.k].n + " " + o.pct + "%"; }).join(" · ");
  }

  function answerText(q){
    var v = answers[q.id];
    if(q.kind === "choice"){
      if(v == null) return "—";
      if(q.opts[v].other) return "Altro: " + (answers[q.id + "_t"] || "—");
      return q.opts[v].t;
    }
    if(q.kind === "two") return Array.isArray(v) && v.length ? v.map(function(i,k){ return (k+1) + ") " + q.opts[i].t; }).join("  ") : "—";
    if(q.kind === "stars") return v ? v + "/5" : "—";
    return v ? v : "—";
  }

  function message(name){
    var lines = ["✨ Che tipo di Nicole sei? → " + name, "Mix: " + mixText(), ""];
    V().forEach(function(q,i){ lines.push((i + 1) + ". " + q.label + ": " + answerText(q)); });
    return lines.join("\n");
  }

  function renderResult(){
    fill.style.width = "100%";
    count.textContent = "✓";
    back.disabled = false;
    var p = profile();
    var TITLE = "Nicole The Princess Pizzolina";
    var kind = p.map(function(k){ return PROFILES[k].n; }).join(" & ");
    var name = TITLE + " " + kind;
    var card = el("section","card result");
    var pre = el("div","pre","Gratta per scoprire il tuo profilo");
    card.appendChild(pre);

    var rv = el("div","reveal");
    rv.appendChild(el("div","badge",p.map(function(k){ return PROFILES[k].e; }).join("")));
    rv.appendChild(el("h2",null,TITLE + " 👑"));
    rv.appendChild(el("div","kind",kind));
    card.appendChild(rv);
    var alt = el("button","reveal-alt","oppure tocca qui");
    card.appendChild(alt);

    var after = el("div","after");
    after.appendChild(el("p","desc",PROFILES[p[0]].d));
    var bars = el("div","bars");
    var fills = [];
    mix().forEach(function(o){
      var row = el("div","barrow");
      row.appendChild(el("span",null,PROFILES[o.k].e + " " + PROFILES[o.k].n));
      var tr = el("div","track"); var f = el("i"); tr.appendChild(f); row.appendChild(tr);
      row.appendChild(el("span","pct",o.pct + "%"));
      fills.push([f,o.pct]); bars.appendChild(row);
    });
    after.appendChild(bars);
    var traits = el("div","traits");
    [["La tua nota",6],["La tua domenica",8]].forEach(function(t){
      var q = Q.filter(function(x){return x.id === t[1];})[0];
      var box = el("div","trait");
      box.appendChild(el("b",null,t[0]));
      var v = answers[q.id];
      box.appendChild(el("span",null, v == null ? "—" : q.opts[v].e + " " + q.opts[v].t));
      traits.appendChild(box);
    });
    after.appendChild(traits);

    var msg = message(name);
    var send = el("button","btn accent","Manda il risultato a Nicholas 💬");
    var note = el("div","sent");
    var copybox = el("div","copybox",msg);
    send.onclick = function(){
      var to = ["39","366","718","0983"].join("");
      window.location.href = "https://wa.me/" + to + "?text=" + encodeURIComponent(msg);
      note.textContent = "Si apre WhatsApp: premi invia 💌";
    };
    var copy = el("button","btn soft","Copia il risultato");
    copy.onclick = function(){
      var done = function(){ note.textContent = "Copiato! Incollalo nella chat con Nicholas 💌"; };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(msg).then(done, function(){ copybox.style.display = "block"; note.textContent = "Tieni premuto sul testo per copiarlo"; });
      } else { copybox.style.display = "block"; note.textContent = "Tieni premuto sul testo per copiarlo"; }
    };
    var again = el("button","btn ghost","Rifai il quiz");
    again.onclick = function(){ answers = {}; go(-1, "down"); };
    var row = el("div","row");
    row.appendChild(send); row.appendChild(copy); row.appendChild(again);
    after.appendChild(row);
    after.appendChild(note);
    after.appendChild(copybox);
    card.appendChild(after);
    stage.appendChild(card);
    window.scrollTo(0,0);

    var revealed = false, cv;
    function reveal(){
      if(revealed) return;
      revealed = true;
      if(cv){ cv.style.opacity = "0"; setTimeout(function(){ cv.remove(); }, 500); }
      alt.remove();
      pre.textContent = "Il tuo profilo è";
      after.classList.add("show");
      setTimeout(function(){ fills.forEach(function(x){ x[0].style.width = x[1] + "%"; }); }, 250);
      buzz();
      confetti();
    }
    alt.onclick = reveal;

    // Patina dorata da grattare con il dito.
    requestAnimationFrame(function(){
      var r = rv.getBoundingClientRect();
      cv = document.createElement("canvas");
      cv.className = "scratch";
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
      rv.appendChild(cv);
      var c = cv.getContext("2d");
      var g = c.createLinearGradient(0,0,cv.width,cv.height);
      g.addColorStop(0,"#f3d27a"); g.addColorStop(.5,"#e9a23b"); g.addColorStop(1,"#f6dc96");
      c.fillStyle = g; c.fillRect(0,0,cv.width,cv.height);
      for(var i=0;i<90;i++){ c.fillStyle = "rgba(255,255,255," + (Math.random()*.5) + ")"; c.fillRect(Math.random()*cv.width, Math.random()*cv.height, 2*dpr, 2*dpr); }
      c.fillStyle = "#6b3d0e"; c.textAlign = "center"; c.textBaseline = "middle";
      c.font = "700 " + (20*dpr) + "px 'DM Sans', sans-serif";
      c.fillText("Gratta qui ✨", cv.width/2, cv.height/2);
      c.globalCompositeOperation = "destination-out";
      var down = false, moves = 0;
      function at(e){ var b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * dpr, (e.clientY - b.top) * dpr]; }
      function scratch(e){
        var pt = at(e);
        c.beginPath(); c.arc(pt[0], pt[1], 24*dpr, 0, 6.283); c.fill();
        if(++moves % 8 === 0 && cleared() > 0.5) reveal();
      }
      function cleared(){
        var d = c.getImageData(0,0,cv.width,cv.height).data, n = 0, t = 0;
        for(var i=3;i<d.length;i+=64){ t++; if(d[i] === 0) n++; }
        return n / t;
      }
      cv.addEventListener("pointerdown", function(e){ down = true; try{ cv.setPointerCapture(e.pointerId); }catch(x){} scratch(e); });
      cv.addEventListener("pointermove", function(e){ if(down) scratch(e); });
      cv.addEventListener("pointerup", function(){ down = false; if(cleared() > 0.5) reveal(); });
      cv.addEventListener("pointercancel", function(){ down = false; });
    });
  }

  // Coriandoli al risultato: una raffica dal centro, poi una pioggia lenta dall'alto (~7 s).
  function confetti(){
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var cv = document.createElement("canvas");
    cv.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5";
    document.body.appendChild(cv);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
    var ctx = cv.getContext("2d");
    var colors = ["#c2457a","#e9a23b","#ffffff","#f6c1d4","#7b2d6b","#ffd27a","#7fd1f0"];
    var DUR = 7000, FADE = 1500;
    var parts = [];
    function piece(burst, delay){
      return {
        x: burst ? W/2 + (Math.random()-.5)*W*0.3 : Math.random()*W,
        y: burst ? H*0.35 : -20*dpr - Math.random()*H*0.6,
        vx: burst ? (Math.random()-.5)*16*dpr : (Math.random()-.5)*1.2*dpr,
        vy: burst ? (-Math.random()*14-6)*dpr : (1.2+Math.random()*1.6)*dpr,
        w: (6+Math.random()*7)*dpr, h: (3+Math.random()*4)*dpr,
        r: Math.random()*6.28, vr: (Math.random()-.5)*.3,
        sw: Math.random()*6.28, burst: burst, delay: delay,
        c: colors[Math.floor(Math.random()*colors.length)]
      };
    }
    for(var i=0;i<150;i++) parts.push(piece(true, 0));
    for(var j=0;j<170;j++) parts.push(piece(false, 300 + Math.random()*3500));
    var t0 = performance.now();
    (function frame(now){
      var t = now - t0;
      ctx.clearRect(0,0,W,H);
      var alpha = t > DUR - FADE ? Math.max(0, (DUR - t) / FADE) : 1;
      parts.forEach(function(p){
        if(t < p.delay) return;
        if(p.burst){ p.vy += .34*dpr; p.vx *= .99; }
        else { p.sw += .05; p.vx = Math.sin(p.sw)*1.1*dpr; if(p.vy < 3*dpr) p.vy += .01*dpr; }
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        if(p.y > H + 30*dpr) return;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
      });
      if(t < DUR) requestAnimationFrame(frame); else cv.remove();
    })(t0);
  }

  // stelline di sfondo
  var sp = document.getElementById("sparkles");
  for(var i=0;i<28;i++){
    var s = document.createElement("i");
    s.style.left = Math.random()*100 + "%";
    s.style.top = Math.random()*100 + "%";
    s.style.animationDelay = (Math.random()*4) + "s";
    s.style.animationDuration = (3 + Math.random()*3) + "s";
    sp.appendChild(s);
  }

  render();
  stage.className = "screen in-up is-intro";
})();
</script>
</body>

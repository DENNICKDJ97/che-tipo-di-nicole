<style>
:root{
  --bg1:#2a1530; --bg2:#5b2448; --bg3:#c25b7a;
  --card:rgba(255,255,255,.96); --ink:#2a1530; --muted:#7a6680;
  --accent:#c2457a; --accent2:#e9a23b; --line:#eadfe8; --chip:#fbf4f8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"DM Sans",system-ui,-apple-system,sans-serif;color:var(--ink);
  background:var(--bg1);min-height:100dvh;overflow-x:hidden;
}
/* Foto di sfondo: a pieno schermo, velo scuro per leggere bene.
   Sull'intro la foto si vede di più, durante le domande il velo è più scuro. */
.bg{position:fixed;inset:0;z-index:0;background:url("sfondo.jpg") center 40%/cover no-repeat;transition:filter .6s ease,transform .8s ease}
.veil{position:fixed;inset:0;z-index:0;transition:opacity .6s ease;
  background:linear-gradient(180deg,rgba(42,21,48,0) 0%,rgba(42,21,48,.1) 55%,rgba(42,21,48,.85) 80%,rgba(42,21,48,.96) 100%)}
.veil2{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity .6s ease;
  background:linear-gradient(180deg,rgba(42,21,48,.55),rgba(91,36,72,.72))}
body.quiz .bg{filter:blur(3px) saturate(1.05);transform:scale(1.04)}
body.quiz .veil2{opacity:1}
.screen.is-intro{justify-content:flex-end;padding-bottom:8px}
.sparkles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sparkles i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.0;animation:tw 4s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.75;transform:scale(1.2)}}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:40px;margin:10px 0 12px;visibility:hidden}
.top.on{visibility:visible}
.back{border:0;background:rgba(255,255,255,.14);color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.back:disabled{opacity:.3}
/* Barra di avanzamento: a tutta larghezza, in cima allo schermo */
.bar{position:fixed;left:0;right:0;top:0;height:calc(8px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:rgba(255,255,255,.18);z-index:10;overflow:hidden}
.bar span{display:block;height:8px;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2),#fff);border-radius:0 6px 6px 0;box-shadow:0 0 12px rgba(233,162,59,.7);transition:width .45s ease}
.top:not(.on) .bar{display:none}
.count{color:#fff;font-size:14px;font-weight:700;background:rgba(255,255,255,.14);border-radius:20px;padding:6px 12px;min-width:34px;text-align:right}
.screen{flex:1;display:flex;flex-direction:column;justify-content:center;will-change:transform,opacity}
.screen.in-up{animation:inUp .42s cubic-bezier(.2,.8,.2,1) both}
.screen.in-down{animation:inDown .42s cubic-bezier(.2,.8,.2,1) both}
.screen.out-up{animation:outUp .22s ease-in both}
.screen.out-down{animation:outDown .22s ease-in both}
@keyframes inUp{from{opacity:0;transform:translateY(45vh)}to{opacity:1;transform:none}}
@keyframes inDown{from{opacity:0;transform:translateY(-45vh)}to{opacity:1;transform:none}}
@keyframes outUp{to{opacity:0;transform:translateY(-35vh)}}
@keyframes outDown{to{opacity:0;transform:translateY(35vh)}}
.swipe-hint{text-align:center;color:rgba(255,255,255,.7);font-size:13px;margin-top:14px;min-height:18px}
.card{background:var(--card);border-radius:24px;padding:26px 20px;box-shadow:0 20px 50px rgba(20,5,25,.35)}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.01em}
.intro{text-align:center;color:#fff}
.intro .emoji{font-size:56px;margin-bottom:14px}
.intro h1{font-size:32px;line-height:1.1;margin-bottom:10px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.intro p{color:rgba(255,255,255,.9);font-size:16px;line-height:1.45;margin-bottom:20px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:17px 18px;font:700 17px "DM Sans",sans-serif;cursor:pointer;transition:transform .12s ease,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:#fff;color:var(--ink)}
.btn.accent{background:linear-gradient(135deg,#25d366,#128c7e);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500;font-size:15px;padding:12px}
.btn.soft{background:var(--chip);color:var(--ink);border:1.5px solid var(--line)}
.q-kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.q-title{font-size:25px;line-height:1.2;margin-bottom:20px}
.hint{color:var(--muted);font-size:14px;margin:-12px 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:14px 14px;font:500 16px/1.3 "DM Sans",sans-serif;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s,transform .12s}
.opt:active{transform:scale(.985)}
.opt .e{font-size:26px;width:36px;text-align:center;flex:none}
.opt small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:3px}
.opt.sel{border-color:var(--accent);background:#fdf0f6}
.opt .rank{margin-left:auto;font-weight:700;font-size:14px;color:var(--accent);min-width:24px;text-align:right}
.stars{display:flex;justify-content:center;gap:8px;margin:8px 0 10px}
.star{border:0;background:none;font-size:44px;line-height:1;cursor:pointer;color:#e6dbe4;transition:transform .12s,color .15s}
.star.on{color:var(--accent2)}
.star:active{transform:scale(.9)}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:0 6px}
.other-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:2px}
.other-row input{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:16px "DM Sans",sans-serif;color:var(--ink);outline:none;background:#fff}
.other-row input:focus{border-color:var(--accent)}
.other-row .btn{width:auto;padding:12px 16px;font-size:15px}
textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:16px;padding:14px;font:16px/1.4 "DM Sans",sans-serif;color:var(--ink);resize:vertical;outline:none;background:#fff}
textarea:focus{border-color:var(--accent)}
.row{display:grid;gap:8px;margin-top:16px}
.result{text-align:center}
.result .badge{font-size:54px;margin-bottom:6px}
.result .pre{color:var(--muted);font-size:14px;font-weight:500}
.result h2{font-size:32px;line-height:1.1;margin:6px 0 14px;background:linear-gradient(135deg,var(--accent),#7b2d6b);-webkit-background-clip:text;background-clip:text;color:transparent}
.result .kind{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:22px;color:var(--ink);margin:-6px 0 12px}
.result p.desc{font-size:16px;line-height:1.55;color:#4a3a50;margin-bottom:18px}
.traits{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}
.trait{background:var(--chip);border-radius:14px;padding:12px 10px}
.trait b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
.trait span{font-size:15px;font-weight:500}
.rcards{display:grid;gap:8px;margin:2px 0 22px;text-align:left}
.rcard{display:flex;align-items:center;gap:12px;background:var(--chip);border-radius:14px;padding:11px 12px;animation:afterIn .5s ease both}
.rcard .ri{font-size:22px;width:30px;text-align:center;flex:none}
.rcard b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-bottom:2px}
.rcard span{font-size:15px;font-weight:500;line-height:1.3}
input.field{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font:16px "DM Sans",sans-serif;color:var(--ink);outline:none;background:#fff;margin-bottom:10px}
input.field:focus{border-color:var(--accent)}
.hint2{color:var(--muted);font-size:13px;margin:2px 0 4px}
/* Gratta e scopri */
.reveal{position:relative;border-radius:18px;padding:12px 0 4px;margin:6px 0 4px}
canvas.scratch{position:absolute;inset:0;width:100%;height:100%;border-radius:18px;touch-action:none;cursor:pointer;transition:opacity .5s ease}
.reveal-alt{background:none;border:0;color:var(--muted);font:13px "DM Sans",sans-serif;text-decoration:underline;margin:2px 0 6px;cursor:pointer}
.after{display:none}
.after.show{display:block;animation:afterIn .55s ease both}
@keyframes afterIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* Mix in percentuali */
.bars{display:grid;gap:9px;margin:2px 0 18px;text-align:left}
.barrow{display:grid;grid-template-columns:118px 1fr 40px;align-items:center;gap:8px;font-size:14px;font-weight:500}
.track{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.barrow .pct{text-align:right;color:var(--accent);font-weight:700}
/* Reazione al tocco */
.opt.sel .e{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(1)}}
/* Indizi a metà strada */
.teaser{color:#fff;text-align:center;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:28px;line-height:1.25;padding:0 12px;text-shadow:0 2px 18px rgba(0,0,0,.3)}
.sent{color:var(--muted);font-size:14px;margin-top:10px;min-height:20px}
.copybox{display:none;margin-top:12px;text-align:left;white-space:pre-wrap;font-size:13px;background:var(--chip);border-radius:12px;padding:12px;color:#4a3a50;max-height:180px;overflow:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

      return {
        x: burst ? W/2 + (Math.random()-.5)*W*0.3 : Math.random()*W,
        y: burst ? H*0.35 : -20*dpr - Math.random()*H*0.6,
        vx: burst ? (Math.random()-.5)*16*dpr : (Math.random()-.5)*1.2*dpr,
        vy: burst ? (-Math.random()*14-6)*dpr : (1.2+Math.random()*1.6)*dpr,
        w: (6+Math.random()*7)*dpr, h: (3+Math.random()*4)*dpr,
        r: Math.random()*6.28, vr: (Math.random()-.5)*.3,
        sw: Math.random()*6.28, burst: burst, delay: delay,
        c: colors[Math.floor(Math.random()*colors.length)]
      };
    }
    for(var i=0;i<150;i++) parts.push(piece(true, 0));
    for(var j=0;j<170;j++) parts.push(piece(false, 300 + Math.random()*3500));
    var t0 = performance.now();
    (function frame(now){
      var t = now - t0;
      ctx.clearRect(0,0,W,H);
      var alpha = t > DUR - FADE ? Math.max(0, (DUR - t) / FADE) : 1;
      parts.forEach(function(p){
        if(t < p.delay) return;
        if(p.burst){ p.vy += .34*dpr; p.vx *= .99; }
        else { p.sw += .05; p.vx = Math.sin(p.sw)*1.1*dpr; if(p.vy < 3*dpr) p.vy += .01*dpr; }
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        if(p.y > H + 30*dpr) return;
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
      });
      if(t < DUR) requestAnimationFrame(frame); else cv.remove();
    })(t0);
  }

  // stelline di sfondo
  var sp = document.getElementById("sparkles");
  for(var i=0;i<28;i++){
    var s = document.createElement("i");
    s.style.left = Math.random()*100 + "%";
    s.style.top = Math.random()*100 + "%";
    s.style.animationDelay = (Math.random()*4) + "s";
    s.style.animationDuration = (3 + Math.random()*3) + "s";
    sp.appendChild(s);
  }

  render();
  stage.className = "screen in-up is-intro";
})();
</script>
